name: Build Souchastnik with Gemini Nano

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-gemini.yml'
      - 'patches/**'
  pull_request:
    paths:
      - '.github/workflows/build-gemini.yml'
      - 'patches/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source matches target commit
        shell: bash
        run: |
          set -euo pipefail
          expected="df86f6ce02daf6daaad416c43839ca707a23e73d"
          git fetch --no-tags --depth=1 origin "$expected"
          git diff --quiet "$expected" -- \
            app/build.gradle.kts \
            app/src/main/java/dev/souchastnik/ime/SouchastnikIME.kt
          echo "Source files match target commit: $expected"

      - name: Apply Gemini Nano patch
        shell: bash
        run: python3 patches/apply-gemini.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souchastnik-gemini-nano-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload patched sources
        uses: actions/upload-artifact@v4
        with:
          name: souchastnik-gemini-nano-sources
          path: |
            app/build.gradle.kts
            app/src/main/java/dev/souchastnik/ai/GeminiNanoClient.kt
            app/src/main/java/dev/souchastnik/ime/SouchastnikIME.kt
            patches/apply-gemini.py
          retention-days: 14
