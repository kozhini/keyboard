name: Build Souchastnik with Gemini Nano

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-gemini.yml"
      - "patches/**"
  pull_request:
    paths:
      - ".github/workflows/build-gemini.yml"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build.gradle.kts
          test -f app/src/main/java/dev/souchastnik/ime/SouchastnikIME.kt
          test -f patches/apply-gemini.py

          echo "Source files found."
          git rev-parse HEAD

      - name: Apply Gemini Nano patch
        run: |
          python3 patches/apply-gemini.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK:"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souchastnik-gemini-nano-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload patched sources
        uses: actions/upload-artifact@v4
        with:
          name: souchastnik-gemini-nano-sources
          path: |
            app/build.gradle.kts
            app/src/main/java/dev/souchastnik/ime/SouchastnikIME.kt
            app/src/main/java/dev/souchastnik/ai/GeminiNanoClient.kt
          retention-days: 14
